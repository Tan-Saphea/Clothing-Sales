plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.owasp.dependencycheck' version '13.0.0'
}

group = 'com.clothing'
version = '0.0.1-SNAPSHOT'
description = 'Clothing Sales Management System'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDirs 'src/integrationTest/resources', 'database'
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.cloudinary:cloudinary-http5:2.4.0'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'com.oracle.database.jdbc:ojdbc17:23.26.3.0.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    integrationTestImplementation 'org.testcontainers:testcontainers-oracle-free:2.0.5'
    integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    integrationTestImplementation 'com.microsoft.playwright:playwright:1.63.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Pass Oracle connection env vars from the shell into the Spring Boot JVM process
bootRun {
    def oracleDbHost = System.getenv('ORACLE_DB_HOST')
    def oracleDbUrl = System.getenv('ORACLE_DB_URL')
    def dbHost = oracleDbHost ?: 'localhost'
    def dbPort = System.getenv('ORACLE_DB_PORT') ?: '1522'
    def dbService = System.getenv('ORACLE_DB_SERVICE') ?: 'FREEPDB1'
    def dbUser = System.getenv('ORACLE_DB_USER') ?: 'CLOTHING_APP'
    def dbPassword = System.getenv('ORACLE_DB_PASSWORD') ?: ''

    environment 'ORACLE_DB_HOST', oracleDbHost ?: ''
    environment 'ORACLE_DB_PORT', dbPort
    environment 'ORACLE_DB_SERVICE', dbService
    environment 'ORACLE_DB_USER', dbUser
    environment 'ORACLE_DB_PASSWORD', dbPassword
    environment 'JPA_SHOW_SQL', System.getenv('JPA_SHOW_SQL') ?: 'false'
    environment 'DEMO_DATA_ENABLED', System.getenv('DEMO_DATA_ENABLED') ?: 'false'
    environment 'BOOTSTRAP_ADMIN_ENABLED', System.getenv('BOOTSTRAP_ADMIN_ENABLED') ?: 'false'

    if (oracleDbHost || oracleDbUrl) {
        environment 'SPRING_PROFILES_ACTIVE', 'oracle'
        jvmArgs '-Dspring.profiles.active=oracle'
        jvmArgs "-Dspring.datasource.url=${oracleDbUrl ?: "jdbc:oracle:thin:@//${dbHost}:${dbPort}/${dbService}"}"
        jvmArgs "-Dspring.datasource.username=${dbUser}"
        jvmArgs "-Dspring.datasource.password=${dbPassword}"
        jvmArgs '-Dspring.datasource.driver-class-name=oracle.jdbc.OracleDriver'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs Oracle Testcontainers and browser end-to-end tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

tasks.register('playwrightInstall', JavaExec) {
    description = 'Installs the Chromium browser used by the end-to-end tests.'
    group = 'verification'
    classpath = sourceSets.integrationTest.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
}

dependencyCheck {
    failBuildOnCVSS = 7.0
    formats = ['HTML', 'JSON']
    suppressionFile = 'config/dependency-check-suppressions.xml'
}
