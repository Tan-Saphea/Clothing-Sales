# Production starts only when TLS and database secrets are supplied explicitly.
server.ssl.enabled=true
server.ssl.key-store=${TLS_KEY_STORE}
server.ssl.key-store-password=${TLS_KEY_STORE_PASSWORD}
server.ssl.key-store-type=${TLS_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${TLS_KEY_ALIAS:clothing-app}
server.servlet.session.cookie.secure=true

# Emit structured JSON to stdout for collection by the deployment platform.
logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.com.clothing.app=INFO

management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
