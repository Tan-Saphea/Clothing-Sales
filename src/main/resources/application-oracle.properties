# Activates when Oracle connection info is supplied via environment variables.
spring.config.activate.on-property.name=ORACLE_DB_HOST
# Oracle datasource (overrides defaults)
spring.datasource.url=jdbc:oracle:thin:@//${ORACLE_DB_HOST:localhost}:${ORACLE_DB_PORT:1522}/${ORACLE_DB_SERVICE:FREEPDB1}
spring.datasource.username=${ORACLE_DB_USER:CLOTHING_APP}
spring.datasource.password=${ORACLE_DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Keep Hibernate defaults for production/oracle
spring.jpa.properties.hibernate.default_schema=${ORACLE_DB_SCHEMA:${ORACLE_DB_USER:CLOTHING_APP}}
