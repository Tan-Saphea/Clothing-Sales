spring.application.name=clothing-app

# ==========================================
# Oracle Database
# ==========================================
# Easy port override: export ORACLE_DB_PORT=1521 or 1522 before starting the app
spring.datasource.url=${ORACLE_DB_URL:jdbc:oracle:thin:@//${ORACLE_DB_HOST:localhost}:${ORACLE_DB_PORT:1522}/${ORACLE_DB_SERVICE:FREEPDB1}}
spring.datasource.username=${ORACLE_DB_USER:CLOTHING_APP}
spring.datasource.password=${ORACLE_DB_PASSWORD:Clothing123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


# ==========================================
# JPA / Hibernate (do not auto-create schema)
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=${ORACLE_DB_SCHEMA:${ORACLE_DB_USER:CLOTHING_APP}}
# Explicit Oracle dialect so Hibernate does not need a live connection to auto-detect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
# Prevent DevTools from trying to manage an in-memory (H2) database shutdown
# Prevent Spring Boot from trying to run SQL schema init scripts (managed by oracle-bootstrap.sql)
spring.autoconfigure.exclude=\
  org.springframework.boot.devtools.autoconfigure.DevToolsDataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration

# ==========================================
# Server
# ==========================================
server.port=${SERVER_PORT:8081}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# ==========================================
# Thymeleaf
# ==========================================
# ==========================================
# File Upload (Multipart)
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.enabled=true

# ==========================================
# Cloudinary Image Storage
# ==========================================
# Provide credentials via environment variables. If left blank, uploads fall back to local disk.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:v2w9olom}
cloudinary.api-key=${CLOUDINARY_API_KEY:773841939818133}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:4tGcttjWgtnbW9jHV2KuZQa3vBM}
cloudinary.folder=${CLOUDINARY_FOLDER:Clothing App}

# ==========================================
# Security & Rate Limiting
# ==========================================
app.security.max-login-attempts=5
app.security.lockout-duration-minutes=15

# Health endpoints expose status only; component details remain private.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Populate sample catalog, accounts, and transactions only when explicitly requested.
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
app.demo-data.admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo-data.cashier-password=${DEMO_CASHIER_PASSWORD:}
app.schema-migration.enabled=${SCHEMA_MIGRATION_ENABLED:true}

# One-time production administrator provisioning. Disable after the first successful startup.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.employee-name=${BOOTSTRAP_ADMIN_NAME:System Administrator}
