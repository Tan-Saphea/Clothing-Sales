<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: head('Categories')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/nav :: sidebar('categories')}"></aside>

    <div class="main-wrapper">
        <header th:replace="~{fragments/nav :: topbar('Categories', 'Product Categories')}"></header>

        <main class="content-body">
            <!-- Action Header -->
            <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
                <div>
                    <h3 class="fw-bold mb-1" style="color: var(--color-primary-navy);">Category Management</h3>
                    <p class="text-muted mb-0">Organize and group clothing apparel, sportswear, and fashion accessories.</p>
                </div>
                <div class="d-flex gap-2">
                    <div class="search-box">
                        
                        <input type="text" id="categorySearch" class="form-control" placeholder="Search categories...">
                    </div>
                    <button class="btn btn-brand-primary" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                         Add Category
                    </button>
                </div>
            </div>

            <!-- Categories Card & Table -->
            <div class="card">
                <div class="table-responsive">
                    <table class="table-pro" id="categoriesTable">
                        <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Category Name</th>
                            <th>Description</th>
                            <th>Created Timestamp</th>
                            <th style="width: 120px;" class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="5" class="text-center text-muted py-4">No categories created yet.</td>
                        </tr>
                        <tr th:each="category : ${categories}" th:id="'cat-row-' + ${category.categoryId}">
                            <td class="fw-bold text-muted" th:text="'#' + ${category.categoryId}">#1</td>
                            <td class="fw-semibold text-primary" th:id="'cat-name-' + ${category.categoryId}" th:text="${category.categoryName}">T-Shirts</td>
                            <td class="text-muted" th:id="'cat-desc-' + ${category.categoryId}" th:text="${category.description ?: 'No description'}">Casual shirts</td>
                            <td class="text-muted small" th:text="${category.createdAt}">2026-09-16</td>
                            <td class="text-end">
                                <div class="d-flex justify-content-end gap-1">
                                    <button class="btn btn-sm btn-icon-sm btn-outline-primary"
                                            title="Edit Category"
                                            th:onclick="'openEditModal(' + ${category.categoryId} + ')'">
                                        Edit
                                    </button>
                                    <button class="btn btn-sm btn-icon-sm btn-outline-danger"
                                            title="Delete Category"
                                            th:onclick="'deleteCategory(' + ${category.categoryId} + ')'">
                                        Delete
                                    </button>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Add Category Modal -->
<div class="modal fade" id="addCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header-brand">
                <h5 class="modal-title">
                     Add New Category
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="addCategoryForm" onsubmit="submitCreateCategory(event)">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="newCategoryName">Category Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="newCategoryName" required placeholder="e.g. Hoodies, Denim">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="newCategoryDescription">Description</label>
                        <textarea class="form-control" id="newCategoryDescription" rows="3" placeholder="Brief category description..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-sm btn-brand-primary">
                         Create Category
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Category Modal -->
<div class="modal fade" id="editCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header-brand">
                <h5 class="modal-title">
                     Edit Category
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="editCategoryForm" onsubmit="submitEditCategory(event)">
                <input type="hidden" id="editCategoryId">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="editCategoryName">Category Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="editCategoryName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="editCategoryDescription">Description</label>
                        <textarea class="form-control" id="editCategoryDescription" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-sm btn-brand-primary">
                         Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/nav :: dbModal}"></div>
<div th:replace="~{fragments/nav :: scripts}"></div>

<script>
  setupTableSearch('categorySearch', 'categoriesTable');

  async function submitCreateCategory(e) {
    e.preventDefault();
    const name = document.getElementById('newCategoryName').value.trim();
    const desc = document.getElementById('newCategoryDescription').value.trim();

    try {
      await apiRequest('/api/categories', 'POST', { categoryName: name, description: desc });
      showToast('Category created successfully!', 'success');
      bootstrap.Modal.getInstance(document.getElementById('addCategoryModal')).hide();
      setTimeout(() => window.location.reload(), 600);
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function openEditModal(id) {
    const name = document.getElementById('cat-name-' + id).innerText;
    const desc = document.getElementById('cat-desc-' + id).innerText;

    document.getElementById('editCategoryId').value = id;
    document.getElementById('editCategoryName').value = name;
    document.getElementById('editCategoryDescription').value = desc === 'No description' ? '' : desc;

    const modal = new bootstrap.Modal(document.getElementById('editCategoryModal'));
    modal.show();
  }

  async function submitEditCategory(e) {
    e.preventDefault();
    const id = document.getElementById('editCategoryId').value;
    const name = document.getElementById('editCategoryName').value.trim();
    const desc = document.getElementById('editCategoryDescription').value.trim();

    try {
      await apiRequest(`/api/categories/${id}`, 'PUT', { categoryName: name, description: desc });
      showToast('Category updated successfully!', 'success');
      bootstrap.Modal.getInstance(document.getElementById('editCategoryModal')).hide();
      setTimeout(() => window.location.reload(), 600);
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function deleteCategory(id) {
    if (!confirm(`Are you sure you want to delete Category #${id}?`)) return;

    try {
      await apiRequest(`/api/categories/${id}`, 'DELETE');
      showToast('Category deleted successfully.', 'success');
      const row = document.getElementById('cat-row-' + id);
      if (row) row.remove();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }
</script>
</body>
</html>
